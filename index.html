<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cronograma 2026 — Projetos de Indústria de Biotecnologia II</title>
<style>
  :root{
    --deep:      #f5f8f4;
    --deep2:     #eef4ee;
    --surface:   #ffffff;
    --surface2:  #f2f7f1;
    --purple:    #6d5fb0;
    --teal:      #2f8c82;
    --green:     #5fa14c;
    --yellow:    #b7a927;
    --foam:      #1c2e29;
    --foam-dim:  #5c6f68;
    --line:      rgba(28,46,41,0.12);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(109,95,176,0.10), transparent 55%),
      radial-gradient(ellipse at 85% 0%, rgba(199,201,90,0.14), transparent 45%),
      linear-gradient(180deg, var(--deep) 0%, var(--deep2) 100%);
    color: var(--foam);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    min-height: 100vh;
    padding: 0 0 80px 0;
  }

  .utility{
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  /* ---------- Kelp divider (signature element) ---------- */
  .kelp-strand{
    width:100%;
    height:34px;
    display:block;
    opacity:0.55;
  }

  /* ---------- Header ---------- */
  header{
    position:relative;
    padding: 56px 24px 40px;
    max-width: 860px;
    margin: 0 auto;
    text-align:center;
  }
  .eyebrow{
    font-family:'Helvetica Neue', Arial, sans-serif;
    letter-spacing:0.22em;
    text-transform:uppercase;
    font-size:11px;
    color: var(--yellow);
    margin-bottom: 14px;
  }
  h1{
    font-size: clamp(28px, 5vw, 44px);
    margin: 0 0 10px;
    font-weight: 700;
    background: linear-gradient(100deg, var(--purple), var(--teal) 45%, var(--green) 70%, var(--yellow));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height:1.15;
  }
  .subtitle{
    color: var(--foam-dim);
    font-size: 15px;
    font-style: italic;
    margin: 0 0 6px;
  }
  .meta{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    color: var(--foam-dim);
    opacity:0.8;
  }

  .progress-wrap{
    max-width: 860px;
    margin: 0 auto 8px;
    padding: 0 24px;
  }
  .progress-track{
    height: 8px;
    border-radius: 5px;
    background: rgba(234,243,236,0.1);
    overflow:hidden;
    border: 1px solid var(--line);
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--purple), var(--teal), var(--green), var(--yellow));
    transition: width 0.5s ease;
  }
  .progress-label{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--foam-dim);
    margin-top: 8px;
    text-align:right;
  }

  /* ---------- Extra-dates toggle ---------- */
  .extra-toggle-wrap{
    max-width: 860px;
    margin: 4px auto 0;
    padding: 0 24px;
    display:flex;
    justify-content:center;
  }
  .extra-toggle{
    display:flex;
    align-items:center;
    gap: 7px;
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--foam-dim);
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .extra-toggle:hover{
    border-color: var(--teal);
    color: var(--foam);
  }
  .extra-toggle .chevron{
    transition: transform 0.25s ease;
    flex:0 0 auto;
  }
  .extra-toggle.open .chevron{
    transform: rotate(180deg);
  }

  .card.extra-entry{
    background: rgba(255,255,255,0.45);
    border: 1px dashed var(--line);
    padding: 10px 18px;
    box-shadow:none;
  }
  .card.extra-entry::after{ display:none; }
  .card.extra-entry .tag{
    color: var(--teal);
  }
  .card.extra-entry .event-title{
    font-size: 14px;
    margin-bottom: 2px;
  }
  .card.extra-entry .event-desc{
    font-size: 12.5px;
  }

  /* ---------- Timeline ---------- */
  .timeline{
    max-width: 860px;
    margin: 30px auto 0;
    padding: 0 24px;
    position: relative;
  }
  .timeline::before{
    content:"";
    position:absolute;
    left: 103px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: linear-gradient(180deg, var(--purple), var(--teal), var(--green), var(--yellow));
    opacity:0.35;
  }
  @media (max-width: 620px){
    .timeline::before{ display:none; }
  }

  .entry{
    position:relative;
    display:grid;
    grid-template-columns: 88px 1fr;
    gap: 30px;
    padding: 18px 0;
    align-items:start;
  }
  @media (max-width: 620px){
    .entry{ grid-template-columns: 1fr; padding-left: 0; gap: 8px; }
    .entry::before{ display:none; }
  }

  .entry::before{
    content:"";
    position:absolute;
    left: 97px;
    top: 26px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--deep);
    border: 2px solid var(--teal);
    z-index:2;
  }
  .entry.done::before{
    background: var(--green);
    border-color: var(--yellow);
    box-shadow: 0 0 10px rgba(199,201,90,0.6);
  }

  .date-col{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-weight:700;
    font-size: 14px;
    color: var(--foam-dim);
    padding-top: 4px;
    padding-right: 10px;
    text-align:right;
    letter-spacing: 0.02em;
  }
  @media (max-width: 620px){
    .date-col{
      padding-right: 0;
      text-align:left;
      padding-top:0;
      padding-left:24px;
      position:relative;
    }
    .date-col::before{
      content:"";
      position:absolute;
      left:0;
      top:50%;
      transform:translateY(-50%);
      width:10px;
      height:10px;
      border-radius:50%;
      background: var(--deep);
      border: 2px solid var(--teal);
    }
    .entry.done .date-col::before{
      background: var(--green);
      border-color: var(--yellow);
      box-shadow: 0 0 8px rgba(199,201,90,0.5);
    }
    .entry.overdue .date-col::before{
      border-color: #9aa39d;
      background: #e2e6e3;
    }
  }

  .card{
    background: linear-gradient(160deg, var(--surface), var(--surface2));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    position: relative;
    overflow:hidden;
    box-shadow: 0 2px 10px rgba(28,46,41,0.06);
  }
  .card::after{
    content:"";
    position:absolute;
    top:0; left:0;
    width: 4px; height:100%;
    background: linear-gradient(180deg, var(--purple), var(--teal), var(--green));
    opacity:0.7;
  }
  .card.milestone::after{
    background: linear-gradient(180deg, var(--yellow), var(--green));
  }

  .card.milestone-delivery{
    background: linear-gradient(160deg, #fbf6df, #f5edc0);
    border: 1px solid rgba(183,169,39,0.35);
  }
  .card.milestone-delivery::after{
    background: linear-gradient(180deg, var(--yellow), var(--green));
    width: 5px;
    opacity: 1;
  }
  .card.milestone-delivery .event-title,
  .card.milestone-delivery .tag{ color:#6b6112; }

  .card.milestone-defense{
    background: linear-gradient(160deg, #efe9fb, #e2d8f5);
    border: 1px solid rgba(109,95,176,0.4);
  }
  .card.milestone-defense::after{
    background: linear-gradient(180deg, var(--purple), #4a3b8a);
    width: 5px;
    opacity: 1;
  }
  .card.milestone-defense .event-title,
  .card.milestone-defense .tag{ color:#4a3b8a; }
  .card.past{
    filter: grayscale(0.65);
    opacity: 0.55;
  }
  .card.past:hover{
    opacity: 0.8;
  }
  .entry.overdue::before{
    border-color: #9aa39d;
    background: #e2e6e3;
  }
  .entry.overdue .date-col{
    opacity: 0.6;
  }
  .card.simple{
    background: transparent;
    border: 1px dashed var(--line);
    padding: 10px 18px;
  }
  .card.simple::after{ display:none; }

  .card-head{
    display:flex;
    align-items:flex-start;
    gap: 12px;
  }

  .card-head.checkable{ cursor:pointer; }

  .checkbox{
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--teal);
    margin-top: 2px;
    cursor:pointer;
    background: #ffffff;
    position:relative;
    transition: all 0.2s ease;
  }
  .checkbox:hover{ border-color: var(--yellow); transform: scale(1.06); }
  .checkbox.checked{
    background: linear-gradient(135deg, var(--green), var(--teal));
    border-color: var(--green);
  }
  .checkbox.checked::after{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color: #ffffff;
    font-size: 15px;
    font-weight:900;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }

  .tag{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--yellow);
    font-weight: 700;
    display:block;
    margin-bottom: 3px;
  }
  .event-title{
    font-size: 16px;
    font-weight: 700;
    color: var(--foam);
    margin: 0 0 4px;
  }
  .event-desc{
    font-size: 13.5px;
    color: var(--foam-dim);
    line-height: 1.5;
    margin: 0;
  }
  .info-text{
    font-size: 13px;
    color: var(--foam-dim);
    font-style: italic;
  }

  /* link field under presentations */
  .link-row{
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display:flex;
    align-items:center;
    gap: 8px;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .link-row svg{ flex:0 0 auto; opacity:0.7; }
  .link-input{
    flex:1;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--foam);
    font-size: 12.5px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    outline:none;
  }
  .link-input::placeholder{ color: rgba(28,46,41,0.35); }
  .link-input:focus{ border-color: var(--teal); }
  .link-go{
    flex:0 0 auto;
    font-size: 11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: #ffffff;
    background: linear-gradient(100deg, var(--teal), var(--green));
    border:none;
    border-radius: 7px;
    padding: 7px 12px;
    cursor:pointer;
    text-decoration:none;
    white-space:nowrap;
    opacity: 0.4;
    pointer-events:none;
    transition: opacity 0.2s ease;
  }
  .link-go.active{ opacity:1; pointer-events:auto; }
  .save-hint{
    font-size:10px;
    color: var(--foam-dim);
    opacity:0;
    transition: opacity 0.3s ease;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .save-hint.show{ opacity:0.7; }

  /* comment / related content field */
  .comment-row{
    margin-top: 10px;
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .comment-label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing: 0.08em;
    color: var(--foam-dim);
    margin-bottom: 5px;
  }
  .comment-label svg{ opacity:0.7; }
  .comment-input{
    width:100%;
    resize: vertical;
    min-height: 46px;
    max-height: 140px;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--foam);
    font-size: 12.5px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    outline:none;
    line-height:1.45;
  }
  .comment-input::placeholder{ color: rgba(28,46,41,0.35); }
  .comment-input:focus{ border-color: var(--teal); }
  .comment-footer{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap: 10px;
    margin-top: 4px;
  }
  .char-count{
    font-size: 10px;
    color: var(--foam-dim);
    opacity: 0.7;
  }
  .char-count.limit{ color: #b3491f; opacity:1; }

  footer{
    max-width: 860px;
    margin: 40px auto 0;
    padding: 0 24px;
    text-align:center;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    color: var(--foam-dim);
    opacity:0.6;
  }
</style>
</head>

const JSONBIN_ID = "6a7bb3e2f5f4af5e29097f31";
const JSONBIN_KEY = "$2a$10$9GMREb9GHtnUUIzyYFK.FOmMnWbIvprEtPVH0WphYv6qP7.J1eZOe";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

function iconLink(){
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b9d0c8" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.49-1.49"/></svg>`;
}
function iconComment(){
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5c6f68" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
}
function escapeHtml(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

const MAX_COMMENT = 300;

const YEAR = 2026;
function parseEntryDate(dateStr){
  const [d, m] = dateStr.split('/').map(Number);
  return new Date(YEAR, m - 1, d);
}
function isPastDate(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  return parseEntryDate(dateStr) < today;
}

let showHidden = false;
let lastState = {};

function render(state){
  lastState = state;
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';

  const visibleEntries = ENTRIES
    .filter(entry => !entry.hidden || showHidden)
    .sort((a, b) => parseEntryDate(a.date) - parseEntryDate(b.date));

  visibleEntries.forEach(entry => {
    const s = state[entry.id] || {done:false, link:"", comment:""};
    const isCheckable = entry.type !== "class" && !entry.hidden;
    const hasLink = entry.type === "presentation";
    const overdue = isCheckable && !s.done && isPastDate(entry.date);

    const wrap = document.createElement('div');
    wrap.className = "entry" + (isCheckable && s.done ? " done" : "") + (overdue ? " overdue" : "");

    const cardClass = (entry.hidden ? "card extra-entry"
      : entry.type === "class" ? "card simple"
      : entry.type === "delivery" ? "card milestone-delivery"
      : entry.type === "defense" ? "card milestone-defense"
      : "card") + (overdue ? " past" : "");

    let checkboxHtml = "";
    if(isCheckable){
      checkboxHtml = `<button class="checkbox ${s.done ? 'checked':''}" data-id="${entry.id}" aria-label="Marcar como concluído"></button>`;
    }

    let linkHtml = "";
    if(hasLink){
      const hasVal = s.link && s.link.trim().length > 0;
      const commentVal = s.comment || "";
      const commentLen = commentVal.length;
      linkHtml = `
        <div class="link-row">
          ${iconLink()}
          <input class="link-input" type="text" placeholder="Link dos slides…" value="${s.link ? s.link.replace(/"/g,'&quot;') : ''}" data-linkid="${entry.id}">
          <a class="link-go ${hasVal ? 'active':''}" href="${hasVal ? s.link : '#'}" target="_blank" rel="noopener" data-goid="${entry.id}">Abrir</a>
          <span class="save-hint utility" data-hintid="${entry.id}">salvo</span>
        </div>
        <div class="comment-row">
          <div class="comment-label">${iconComment()}<span>Comentários / conteúdos relacionados</span></div>
          <textarea class="comment-input" maxlength="${MAX_COMMENT}" placeholder="Anotações, referências, links de artigos…" data-commentid="${entry.id}">${escapeHtml(commentVal)}</textarea>
          <div class="comment-footer">
            <span class="char-count utility" data-countid="${entry.id}">${commentLen}/${MAX_COMMENT}</span>
          </div>
        </div>`;
    }

    wrap.innerHTML = `
      <div class="date-col utility">${entry.date}</div>
      <div class="${cardClass}">
        <div class="card-head ${isCheckable ? 'checkable' : ''}" ${isCheckable ? `data-headid="${entry.id}"` : ''}>
          ${checkboxHtml}
          <div style="flex:1;">
            ${entry.tag ? `<span class="tag">${entry.tag}</span>` : ""}
            <p class="${entry.type==='class' ? 'info-text' : 'event-title'}">${entry.title}</p>
            ${entry.desc ? `<p class="event-desc">${entry.desc}</p>` : ""}
          </div>
        </div>
        ${linkHtml}
      </div>
    `;
    tl.appendChild(wrap);
  });

  // progress
  const checkable = ENTRIES.filter(e => e.type !== "class" && !e.hidden);
  const doneCount = checkable.filter(e => (state[e.id]||{}).done).length;
  const pct = checkable.length ? Math.round((doneCount/checkable.length)*100) : 0;
  document.getElementById('progressFill').style.width = pct + "%";
  document.getElementById('progressLabel').textContent = `${doneCount} de ${checkable.length} concluídas`;

  // handlers
  async function toggle(id){
    state[id] = state[id] || {done:false, link:"", comment:""};
    state[id].done = !state[id].done;
    await save(state);
    render(state);
  }

  tl.querySelectorAll('.checkbox').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggle(btn.dataset.id);
    });
  });

  tl.querySelectorAll('.card-head.checkable').forEach(head => {
    head.addEventListener('click', (e) => {
      // avoid double-toggling when the click already landed on the checkbox itself
      if(e.target.closest('.checkbox')) return;
      toggle(head.dataset.headid);
    });
  });

  tl.querySelectorAll('.link-input').forEach(input => {
    let debounce;
    input.addEventListener('input', () => {
      const id = input.dataset.linkid;
      const val = input.value.trim();
      state[id] = state[id] || {done:false, link:"", comment:""};
      state[id].link = val;

      const goBtn = tl.querySelector(`[data-goid="${id}"]`);
      if(goBtn){
        if(val){ goBtn.href = val; goBtn.classList.add('active'); }
        else{ goBtn.href = '#'; goBtn.classList.remove('active'); }
      }

      clearTimeout(debounce);
      debounce = setTimeout(async () => {
        await save(state);
        const hint = tl.querySelector(`[data-hintid="${id}"]`);
        if(hint){
          hint.classList.add('show');
          setTimeout(()=> hint.classList.remove('show'), 1200);
        }
      }, 500);
    });
  });

  tl.querySelectorAll('.comment-input').forEach(area => {
    let debounce;
    area.addEventListener('input', () => {
      const id = area.dataset.commentid;
      const val = area.value.slice(0, MAX_COMMENT);
      state[id] = state[id] || {done:false, link:"", comment:""};
      state[id].comment = val;

      const counter = tl.querySelector(`[data-countid="${id}"]`);
      if(counter){
        counter.textContent = `${val.length}/${MAX_COMMENT}`;
        counter.classList.toggle('limit', val.length >= MAX_COMMENT);
      }

      clearTimeout(debounce);
      debounce = setTimeout(async () => {
        await save(state);
      }, 500);
    });
  });
}

async function load(){
  try{
    const res = await fetch(`${JSONBIN_URL}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if(!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    return data.record || {};
  }catch(e){
    console.error("Erro ao carregar:", e);
    return {};
  }
}

async function save(state){
  try{
    await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify(state)
    });
  }catch(e){
    console.error("Erro ao salvar:", e);
  }
}

(async function init(){
  const state = await load();
  render(state);

  const toggleBtn = document.getElementById('toggleExtra');
  const toggleLabel = document.getElementById('extraToggleLabel');
  toggleBtn.addEventListener('click', () => {
    showHidden = !showHidden;
    toggleBtn.classList.toggle('open', showHidden);
    toggleLabel.textContent = showHidden
      ? 'Ocultar reuniões semanais e prazos internos'
      : 'Mostrar reuniões semanais e prazos internos';
    render(lastState);
  });

  // Atualiza periodicamente para refletir o que outras pessoas preencheram,
  // sem interromper quem estiver digitando no momento.
  setInterval(async () => {
    const tl = document.getElementById('timeline');
    const active = document.activeElement;
    const isTyping = active && tl && tl.contains(active) &&
      (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
    if(isTyping) return;
    const freshState = await load();
    render(freshState);
  }, 15000);
})();
</script>
